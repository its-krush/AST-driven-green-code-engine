<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AST Green-Code Engine</title><style>body{margin:0;background:#0b1220;color:#e6edf7;font:15px system-ui}header{padding:28px 6%;border-bottom:1px solid #21314a}main{max-width:1250px;margin:28px auto;padding:0 24px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.card{background:#111d31;border:1px solid #263b59;border-radius:14px;padding:18px}textarea{width:100%;height:350px;background:#0b1424;color:#cde2ff;border:1px solid #314a6b;border-radius:10px;padding:14px;box-sizing:border-box;font:13px ui-monospace}button{background:#43d17b;color:#06130b;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#263b59;color:#d8e8ff}#findings{display:grid;gap:8px}.finding{padding:11px;border-left:3px solid #ffbd59;background:#18273e;border-radius:6px}.finding.error{border-color:#ff6b6b}.metrics{display:flex;gap:10px;flex-wrap:wrap}.metric{background:#172840;border-radius:8px;padding:13px;min-width:110px}.metric b{display:block;font-size:22px;color:#5ee38d}pre{white-space:pre-wrap;max-height:300px;overflow:auto;color:#b9d7ff}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>AST Green-Code Engine</h1><p>Static refactoring for lower CPU, memory, and layout work.</p></header><main><div class="grid"><section class="card"><h2>Source input</h2><textarea id="code" spellcheck="false">for (let i = 0; i &lt; 10; i++) {\n  document.querySelector('.item').textContent = items.map(render).join('');\n}\nwindow.addEventListener('scroll', () =&gt; updatePosition());</textarea><div><button onclick="analyze()">Analyze source</button><button onclick="refactor()">Apply refactoring</button><input id="file" type="file" accept=".js,.jsx,.ts,.tsx,.zip" onchange="upload(event)"></div></section><section class="card"><h2>Energy score</h2><div class="metrics"><div class="metric"><span>Score</span><b id="score">—</b></div><div class="metric"><span>Findings</span><b id="count">—</b></div><div class="metric"><span>AST body</span><b id="body">—</b></div></div><h3>Detected anti-patterns</h3><div id="findings"><p>Run an analysis to see suggestions.</p></div></section></div><section class="card" style="margin-top:18px"><h2>Optimization window</h2><div class="grid"><div><h3>Original</h3><pre id="before">—</pre></div><div><h3>Refactored</h3><pre id="after">—</pre></div></div></section></main><script>const $=id=>document.getElementById(id); async function call(url,body){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error);return d} function render(d){if(d.error){$('findings').innerHTML='<p style="color:#ff8c8c">'+d.error+'</p>';return} const a=d.after||d; $('score').textContent=a.score; $('count').textContent=a.findings.length; $('body').textContent=(a.ast||{}).body||'—'; $('findings').innerHTML=a.findings.length?a.findings.map(f=>'<div class="finding '+f.severity+'"><b>'+f.title+'</b><br><small>Line '+f.line+': '+f.message+'</small><br><small>Suggestion: '+f.suggestion+'</small></div>').join(''):'<p>Clean: no supported anti-patterns found.</p>'; if(d.before){$('before').textContent=d.before.code;$('after').textContent=d.after.code}else $('before').textContent=a.code} async function analyze(){try{render(await call('/api/analyze',{code:$('code').value,filename:'dashboard.ts'}))}catch(e){render({error:e.message})}} async function refactor(){try{const d=await call('/api/refactor',{code:$('code').value,filename:'dashboard.ts'});$('code').value=d.after.code;render(d)}catch(e){render({error:e.message})}} async function upload(e){const fd=new FormData();fd.append('file',e.target.files[0]);const r=await fetch('/api/upload',{method:'POST',body:fd});render(await r.json())}</script></body></html>
